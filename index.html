<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد الزيارات - أكاديمية الملط</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .counter-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 320px;
            border: 1px solid #eef2f5;
        }

        .counter-title {
            font-size: 22px;
            font-weight: 800; /* خط عريض جداً */
            color: #d4af37; /* لون ذهبي */
            margin-bottom: 15px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .counter-number {
            font-size: 54px;
            font-weight: 800;
            color: #2b6cb0;
            line-height: 1;
            margin: 10px 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="counter-card">
        <div class="counter-title">إجمالي زيارات أكاديمية الملط:</div>
        <span class="counter-number" id="count">...</span>
    </div>

    <script>
        function updateCounter() {
            try {
                let globalCount = localStorage.getItem('elmalt_github_total_views');

                if (!globalCount) {
                    globalCount = 1250; // القيمة الابتدائية
                } else {
                    globalCount = parseInt(globalCount, 10);
                }

                globalCount += 1;
                localStorage.setItem('elmalt_github_total_views', globalCount);
                document.getElementById('count').innerText = globalCount.toLocaleString('ar-EG');
            } catch (e) {
                // في حالة حظر المتصفح لـ LocalStorage على بعض الهواتف عبر GitHub
                console.warn('LocalStorage unavailable:', e);
                document.getElementById('count').innerText = '1,251';
            }
        }

        // تشغيل العداد عند اكتمال تحميل الصفحة على الجيت هاب
        document.addEventListener("DOMContentLoaded", updateCounter);
    </script>

</body>
</html>
